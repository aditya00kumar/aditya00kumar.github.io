<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">PyTorch knowledge fine-tuning experiment flow</title>
  <desc id="desc">The PyTorch 2.14 release blog informs a claim ledger and datasets. These are evaluated with the base model and two fine-tuned arms, canonical Arm A and complementary Arm B. Arm A and Arm B are combined at three weightings. The six conditions are compared on frozen evaluation questions and manually scored for factual accuracy, qualifiers, unsupported details, relevance, and prefix compliance.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#526579"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #172b3a; }
      .label { font: 700 18px Arial, sans-serif; fill: #172b3a; }
      .detail { font: 15px Arial, sans-serif; fill: #34495a; }
      .stage { font: 700 14px Arial, sans-serif; letter-spacing: 1px; fill: #526579; }
      .box { stroke-width: 2; rx: 12; }
      .arrow { fill: none; stroke: #526579; stroke-width: 2.5; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #526579; stroke-width: 2.5; }
    </style>
  </defs>

  <text class="stage" x="480" y="24" text-anchor="middle">SOURCE AND DATA</text>
  <rect class="box" x="150" y="42" width="660" height="72" fill="#e8f2f4" stroke="#3f7d86"/>
  <text class="label" x="480" y="73" text-anchor="middle">Official PyTorch 2.14 release blog</text>
  <text class="detail" x="480" y="98" text-anchor="middle">Claims and source boundaries verified before dataset authoring</text>
  <path class="arrow" d="M480 114 V145"/>

  <rect class="box" x="150" y="150" width="660" height="82" fill="#f0f3f6" stroke="#6d7c89"/>
  <text class="label" x="480" y="184" text-anchor="middle">Claim ledger and question/answer datasets</text>
  <text class="detail" x="480" y="210" text-anchor="middle">Canonical examples, complementary forms, and frozen evaluation questions</text>
  <path class="arrow" d="M480 232 V271"/>

  <text class="stage" x="350" y="265" text-anchor="middle">MODEL CONDITIONS</text>
  <rect class="box" x="30" y="282" width="280" height="92" fill="#edf3f7" stroke="#526579"/>
  <text class="label" x="170" y="317" text-anchor="middle">Base</text>
  <text class="detail" x="170" y="345" text-anchor="middle">Qwen3-4B, no adapter</text>
  <rect class="box" x="340" y="282" width="280" height="92" fill="#edf5ed" stroke="#658653"/>
  <text class="label" x="480" y="317" text-anchor="middle">Arm A</text>
  <text class="detail" x="480" y="345" text-anchor="middle">Canonical: 1 form x 30 epochs</text>
  <rect class="box" x="650" y="282" width="280" height="92" fill="#fbf2e8" stroke="#b7793e"/>
  <text class="label" x="790" y="317" text-anchor="middle">Arm B</text>
  <text class="detail" x="790" y="345" text-anchor="middle">Complementary: 3 forms x 10 epochs</text>

  <path class="branch" d="M480 374 V399 H790 V374"/>
  <path class="arrow" d="M635 399 V428"/>
  <text class="stage" x="400" y="425" text-anchor="middle">ARM A + ARM B ADAPTER COMBINATIONS</text>

  <rect class="box" x="30" y="442" width="280" height="78" fill="#f1eef7" stroke="#79649a"/>
  <text class="label" x="170" y="475" text-anchor="middle">50 / 50</text>
  <text class="detail" x="170" y="500" text-anchor="middle">Balanced</text>
  <rect class="box" x="340" y="442" width="280" height="78" fill="#f1eef7" stroke="#79649a"/>
  <text class="label" x="480" y="475" text-anchor="middle">75 / 25</text>
  <text class="detail" x="480" y="500" text-anchor="middle">Canonical-heavy</text>
  <rect class="box" x="650" y="442" width="280" height="78" fill="#f1eef7" stroke="#79649a"/>
  <text class="label" x="790" y="475" text-anchor="middle">25 / 75</text>
  <text class="detail" x="790" y="500" text-anchor="middle">Complementary-heavy</text>
  <path class="arrow" d="M170 520 V564"/>
  <path class="arrow" d="M480 520 V564"/>
  <path class="arrow" d="M790 520 V564"/>
  <path class="arrow" d="M170 374 V390 H15 V650 H90"/>

  <rect class="box" x="90" y="577" width="780" height="145" fill="#f7f3e9" stroke="#9b8353"/>
  <text class="label" x="480" y="610" text-anchor="middle">Frozen development and final question sets</text>
  <text class="detail" x="480" y="640" text-anchor="middle">Base, Arm A, Arm B, and three merged candidates</text>
  <text class="detail" x="480" y="669" text-anchor="middle">Manual scores: facts, qualifiers, unsupported details, relevance</text>
  <text class="detail" x="480" y="697" text-anchor="middle">Prefix compliance tracked separately</text>
</svg>
